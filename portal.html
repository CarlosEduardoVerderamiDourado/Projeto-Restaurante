<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ratatue - Portal do Cliente</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 🟢 Cartão principal do portal do cliente -->
    <div class="portal-container">
        <h1 id="titulo-mesa">Mesa: Carregando...</h1>

        <button class="btn-garcom" onclick="solicitarGarcom()">🛎️ Chamar Garçom</button>
        <button class="btn-autoatendimento" onclick="altoatendimento()">🍽️ Auto atendimento</button>
    </div>

    <!-- 🚨 CORTINA DE ESPERA (Bloqueio Visual do Cliente Inteligente) -->
    <div id="tela-espera" class="modal-overlay">
        <div class="modal-caixa">
            <h2 id="status-espera-titulo">🛎️ Chamado Enviado</h2>
            <p id="status-espera-texto">Aguardando um garçom aceitar o atendimento...</p>
            <div id="container-botao-fechar"></div>
        </div>
    </div>

    <script>
        let monitorChamadoCliente = null;

        // ⏳ Carregamento Inicial da Página
        window.onload = function() { 
            const mesa_numero = localStorage.getItem('id_mesa_configurada');
            if (mesa_numero) {
                document.getElementById('titulo-mesa').innerText = "Mesa " + mesa_numero; 
            }
        }
        
        // 🚨 FUNÇÃO 1: Solicitar atendimento e travar a tela visualmente na cortina
        function solicitarGarcom() {
            const mesa = localStorage.getItem('id_mesa_configurada'); 
            if (!mesa) return;

            document.getElementById('titulo-mesa').innerText = "Mesa " + mesa; 

            fetch("http://localhost:3000/api/mesas/solicitar-garcom", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ mesa })
            })
            .then(resposta => resposta.json())
            .then(dados => {
                if (dados.sucesso) {
                    // Ativa a cortina de espera de forma profissional
                    document.getElementById('tela-espera').classList.add('modal-visivel');
                    document.getElementById('status-espera-titulo').innerText = "🛎️ Chamado Enviado";
                    document.getElementById('status-espera-texto').innerText = "Aguardando um garçom aceitar o atendimento...";
                    document.getElementById('container-botao-fechar').innerHTML = ""; 

                    if (!monitorChamadoCliente) {
                        monitorChamadoCliente = setInterval(checarSeGarcomAceitou, 4000);
                    }
                } else {
                    mostrarAvisoCortina("⚠️ Atenção", dados.mensagem, true);
                }
            })
            .catch(erro => console.error("Erro na comunicação:", erro));
        }

        // 🚨 FUNÇÃO 2: Monitor que atualiza a cortina e ativa o clique do botão com segurança
        function checarSeGarcomAceitou() {
            const mesaNumero = localStorage.getItem('id_mesa_configurada');
            if (!mesaNumero) return;

            fetch(`http://localhost:3000/api/garcons/status-mesa/${mesaNumero}`)
            .then(resposta => resposta.json())
            .then(dados => {
                console.log("Monitor de chamado respondeu do servidor:", dados);

                if (dados.ativo) {
                    // 1. Atualiza os textos da cortina escura
                    document.getElementById('status-espera-titulo').innerText = "🏃‍♂️ Garçom a Caminho!";
                    const nomeDoColaborador = dados.garcom || "da equipe";
                    document.getElementById('status-espera-texto').innerHTML = `O garçom <strong>${nomeDoColaborador}</strong> aceitou o seu chamado e está vindo te atender.`;
                    
                    // 2. Injeta o botão com um ID limpo para o JavaScript gerenciar o clique de forma isolada
                    const containerBotao = document.getElementById('container-botao-fechar');
                    containerBotao.innerHTML = `
                        <button id="btn-fechar-espera-mestre" class="btn-pill-sm btn-pill-verde">Ok, Entendido!</button>
                    `;
                    
                    // 3. 🟢 O TRUQUE DO CLIQUE SEGURO: Grampeia a ação de fechar direto no botão sem depender de onclick em texto!
                    document.getElementById('btn-fechar-espera-mestre').addEventListener('click', fecharTelaEspera);

                    // 4. Desliga o cronômetro para não ficar batendo no banco à toa
                    clearInterval(monitorChamadoCliente);
                    monitorChamadoCliente = null;
                }
            })
            .catch(erro => console.error("Erro no monitor de espera do cliente:", erro));
        }

        // 🟢 FUNÇÃO 3 CONSOLIDADA: Garante o fechamento total da cortina escura e desliga loops pendentes
        function fecharTelaEspera() {
            console.log("Cortina fechada pelo cliente. Destravando portal principal...");
            
            // 1. Esconde a cortina da tela
            document.getElementById('tela-espera').classList.remove('modal-visivel');
            
            // 2. Trava de segurança: Desliga de vez o cronômetro para o loop não tentar atualizar elementos ocultos
            if (monitorChamadoCliente) {
                clearInterval(monitorChamadoCliente);
                monitorChamadoCliente = null;
            }
        }

        // 🔀 FUNÇÃO 4: Inicializar Autoatendimento (Totalmente livre de pop-ups cinzas!)
        function altoatendimento(){
            const mesa = localStorage.getItem('id_mesa_configurada'); 
            if (!mesa) return;

            // 🟢 LEVANTA A CORTINA IMEDIATAMENTE COMO CARREGAMENTO!
            document.getElementById('tela-espera').classList.add('modal-visivel');
            document.getElementById('status-espera-titulo').innerText = "📖 Carregando Cardápio";
            document.getElementById('status-espera-texto').innerText = "Buscando os hambúrgueres e bebidas direto no banco de dados...";
            document.getElementById('container-botao-fechar').innerHTML = "";

            fetch("http://localhost:3000/api/mesas/altoatendimento", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ mesa })
            })
            .then(resposta => resposta.json())
            .then(dados => {
                if (dados.sucesso) {
                    // Transição suave para o cardápio
                    setTimeout(() => {
                        window.location.href = "cardapio.html";
                    }, 1500); // 1.5 segundos para o cliente ver a animação de carregamento
                } else {
                    mostrarAvisoCortina("❌ Erro", dados.mensagem, true);
                }
            })
            .catch(erro => {
                console.error("Erro na comunicação:", erro);
                mostrarAvisoCortina("❌ Erro de Rede", "Não foi possível iniciar o autoatendimento.", true);
            });
        }

        // 🧠 FUNÇÃO AUXILIAR: Desenhar avisos ou erros direto na cortina escura para abolir os alerts da tela!
        function mostrarAvisoCortina(titulo, texto, incluirBotaoFechar) {
            document.getElementById('tela-espera').classList.add('modal-visivel');
            document.getElementById('status-espera-titulo').innerText = titulo;
            document.getElementById('status-espera-texto').innerText = texto;
            
            if (incluirBotaoFechar) {
                document.getElementById('container-botao-fechar').innerHTML = `
                    <button onclick="fecharTelaEspera()" class="modal-btn modal-btn-cancelar">Fechar</button>
                `;
            }
        }

    </script>
</body>
</html>
