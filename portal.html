<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ratatue - Portal do Cliente</title>
</head>
<body>
    
    <!-- 🟢 Cabeçalho com o número da mesa -->
    <h1 id="titulo-mesa">Mesa: Carregando...</h1>
    
    <button onclick="solicitarGarcom()">Chamar Garçom</button>
    <button onclick="altoatendimento()">Auto atendimento</button>

    <!-- 🚨 CORTINA DE ESPERA (Bloqueio Visual do Cliente Inteligente) -->
    <div id="tela-espera" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); color: white; z-index: 9999; text-align: center; padding-top: 15%;">
        <div style="background: #222; display: inline-block; padding: 30px; border-radius: 10px; border: 2px solid #ffc107;">
            <h2 id="status-espera-titulo">🛎️ Chamado Enviado</h2>
            <p id="status-espera-texto" style="font-size: 18px; margin: 20px 0;">Aguardando um garçom aceitar o atendimento...</p>
            <div id="container-botao-fechar"></div>
        </div>
    </div>

    <script>
        let monitorChamadoCliente = null;

        // ⏳ Carregamento Inicial da Página
        window.onload = function() { 
            const mesa_numero = localStorage.getItem('id_mesa_configurada');
            if (mesa_numero) {
                document.getElementById('titulo-mesa').innerText = "Mesa " + mesa_numero; 
            }
        }
        
        // 🚨 FUNÇÃO 1: Solicitar atendimento e travar a tela visualmente
        function solicitarGarcom() {
            const mesa = localStorage.getItem('id_mesa_configurada'); 
            if (!mesa) return;

            // Alinha o cabeçalho caso necessário
            document.getElementById('titulo-mesa').innerText = "Mesa " + mesa; 

            fetch("http://localhost:3000/api/mesas/solicitar-garcom", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json" 
                },
                body: JSON.stringify({ mesa })
            })
            .then(resposta => resposta.json())
            .then(dados => {
                if (dados.sucesso) {
                    // 🟢 LEVANTA A CORTINA DE ESPERA NA TELA DO CLIENTE!
                    document.getElementById('tela-espera').style.display = 'block';
                    document.getElementById('status-espera-titulo').innerText = "🛎️ Chamado Enviado";
                    document.getElementById('status-espera-texto').innerText = "Aguardando um garçom aceitar o atendimento...";
                    document.getElementById('container-botao-fechar').innerHTML = ""; // Limpa botões antigos

                    // Ativa o cronômetro para monitorar o aceite do garçom
                    if (!monitorChamadoCliente) {
                        monitorChamadoCliente = setInterval(checarSeGarcomAceitou, 4000);
                    }
                } else {
                    alert(dados.mensagem); 
                }
            })
            .catch(erro => {
                console.error("Erro na comunicação:", erro);
                alert("Não foi possível chamar o garçom.");
            });
        }

        // 🚨 FUNÇÃO 2: Monitor invisível que atualiza a cortina com o nome do garçom
        function checarSeGarcomAceitou() {
            const mesaNumero = localStorage.getItem('id_mesa_configurada');
            if (!mesaNumero) return;

            fetch(`http://localhost:3000/api/garcons/status-mesa/${mesaNumero}`)
            .then(resposta => resposta.json())
            .then(dados => {
                if (dados.ativo) {
                    // 🟢 O GARÇOM ACEITOU! Atualiza o texto dinamicamente com o nome real do MySQL
                    document.getElementById('status-espera-titulo').innerText = "🏃‍♂️ Garçom a Caminho!";
                    document.getElementById('status-espera-texto').innerHTML = `O garçom <strong>${dados.garcom || "da equipe"}</strong> aceitou o seu chamado e está vindo te atender.`;
                    
                    // Cria o botão verde para destravar o tablet
                    document.getElementById('container-botao-fechar').innerHTML = `
                        <button onclick="fecharTelaEspera()" style="padding: 10px 20px; background: #28a745; color: white; border: none; font-weight: bold; border-radius: 4px; cursor: pointer;">Ok, Entendido!</button>
                    `;
                    
                    // Desliga o Polling para aliviar o tráfego do servidor
                    clearInterval(monitorChamadoCliente);
                    monitorChamadoCliente = null;
                }
            })
            .catch(erro => console.error("Erro no monitor de espera:", erro));
        }

        // 🟢 FUNÇÃO 3: Fecha a cortina escura
        function fecharTelaEspera() {
            document.getElementById('tela-espera').style.display = 'none';
        }

        // 🔀 FUNÇÃO 4: Viagem direta para o Autoatendimento (Cardápio)
        function altoatendimento(){
            const mesa = localStorage.getItem('id_mesa_configurada'); 
            if (!mesa) return;

            fetch("http://localhost:3000/api/mesas/altoatendimento", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json" 
                },
                body: JSON.stringify({ mesa })
            })
            .then(resposta => resposta.json())
            .then(dados => {
                if (dados.sucesso) {
                    alert(dados.mensagem); 
                    window.location.href = "cardapio.html";
                } else {
                    alert(dados.mensagem); 
                }
            })
            .catch(erro => {
                console.error("Erro na comunicação:", erro);
                alert("Não foi possível iniciar o autoatendimento.");
            });
        }
    </script>
</body>
</html>
