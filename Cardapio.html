<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ratatue - Cardápio Digital</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 🟢 Cabeçalho identificando a mesa atual -->
    <h2 id="mesa-display">Mesa: Carregando...</h2>

    <!-- 🟢 Botões de Categorias para o cliente filtrar -->
    <div class="categorias-abas">
        <button onclick="filtrarCategoria('Todos')">Todos</button>
        <button onclick="filtrarCategoria('Hambúrgueres')">Hambúrgueres</button>
        <button onclick="filtrarCategoria('Bebidas')">Bebidas</button>
    </div>

    <!-- 🟢 O Tabuleiro de Produtos -->
    <div id="container-produtos">
        <!-- Os produtos vão brotar aqui de dentro dinamicamente! -->
    </div>

    <!-- 🟢 Painel do Resumo Fixado no Rodapé -->
    <div id="resumo-carrinho"></div>
    <!-- 🚨 CORTINA DE SUCESSO (Aviso Visual de Pedido Concluído) -->
<div id="tela-sucesso-pedido" class="modal-overlay">
    <div class="modal-caixa">
        <h2>🚀 Pedido Enviado!</h2>
        <p>Seu prato já está na esteira de preparo da cozinha/bar e será entregue em breve.</p>
        <p class="texto-secundario">Redirecionando para o portal da mesa...</p>
    </div>
</div>

<div id="tela-aviso-cardapio" class="modal-overlay">
    <div class="modal-caixa">
        <h2 id="aviso-titulo">⚠️ Atenção</h2>
        <p id="aviso-texto">Mensagem de aviso aqui...</p>
        <button onclick="fecharCortinaAviso()" class="modal-btn modal-btn-confirmar">Ok, entendi</button>
    </div>
</div>

    <script>

// 🛡️ GUARDA DE SEGURANÇA DA MESA: Impede abertura do cardápio sem mesa vinculada (Sem alert!)
(function() {
    const mesaConfigurada = localStorage.getItem('id_mesa_configurada');

    // 🚨 TRAVA DE OPERAÇÃO: Se o tablet não tiver número de mesa salvo, barra o cardápio na hora!
    if (!mesaConfigurada || mesaConfigurada === "undefined" || mesaConfigurada === "null") {
        console.warn("🚨 ALERTA: Tentativa de abrir o cardápio em um aparelho sem mesa configurada!");
        
        // Como o elemento HTML da cortina pode não ter carregado na primeira linha absoluta,
        // usamos o redirecionamento imediato limpando o fluxo silenciosamente
        window.location.href = "index.html";
    }
})();

        // Variáveis globais de controle
        let todosOsProdutos = [];
        let carrinho = [];
        let alertaExibido = false;

        // 🛒 FUNÇÃO 1: Adicionar item à sacola inteligente com a quantidade escolhida (Livre de pop-ups!)
        function adicionarAoCarrinho(id) {
            const produto = todosOsProdutos.find(p => p.id_item === id);
            
            // Pega o valor numérico que está digitado no seletor daquele card específico
            const inputQtd = document.getElementById(`qtd-${id}`);
            const quantidadeEscolhida = parseInt(inputQtd.value) || 1;

            const itemNoCarrinho = carrinho.find(item => item.id_item === id);

            if (itemNoCarrinho) {
                itemNoCarrinho.quantidade += quantidadeEscolhida;
            } else {
                carrinho.push({ ...produto, quantidade: quantidadeEscolhida });
            }

            console.log("Sacola de Compras Atualizada:", carrinho);
            
            // Retorna o contador do card de volta para 1 para o próximo pedido
            inputQtd.value = 1;
            
            // 🟢 Atualiza o painel financeiro na hora de forma silenciosa e elegante!
            atualizarResumoCarrinho();
        }

        // ⏱️ FUNÇÕES AUXILIARES: Alterar o número no contador visual (+ e -)
        function alterarContadorVisual(id, operacao) {
            const input = document.getElementById(`qtd-${id}`);
            let valorAtual = parseInt(input.value) || 1;

            if (operacao === 'mais') {
                valorAtual++;
            } else if (operacao === 'menos' && valorAtual > 1) {
                valorAtual--;
            }
            
            input.value = valorAtual;
        }

        // 📊 FUNÇÃO 2: Atualizar o resumo financeiro (Sacola + Painel de Rodapé Sticky)
        function atualizarResumoCarrinho() {
            let totalItens = 0;
            let precoTotal = 0;

            carrinho.forEach(item => {
                totalItens += item.quantidade;
                precoTotal += (item.quantidade * Number(item.preco));
            });

            const divResumo = document.getElementById('resumo-carrinho');
            divResumo.innerHTML = `
                <div>
                    <h3>🛒 Sacola Atual</h3>
                    <p>Itens para enviar: <strong>${totalItens}</strong> | Subtotal: <strong>R$ ${precoTotal.toFixed(2)}</strong></p>

                    <div class="resumo-acoes">
                        <button class="btn-pill-sm btn-pill-verde" onclick="enviarPedidoParaCozinha()">Enviar Pedido para Cozinha</button>
                        <button class="btn-pill-sm" onclick="carregarExtratoMesa()">📄 Ver Extrato / Pedir Conta</button>
                    </div>

                    <div id="detalhe-extrato" style="display: none;"></div>
                </div>
            `;
        }

        // 🚀 FUNÇÃO 3: Enviar Pedido para o Servidor (Totalmente livre de pop-ups!)
        function enviarPedidoParaCozinha() {
            const mesaNumero = localStorage.getItem('id_mesa_configurada');
            
            // 🟢 SUBSTITUIÇÃO DO POP-UP DA IMAGEM: Ativa a cortina de aviso com borda amarela!
            if (carrinho.length === 0) {
                mostrarCortinaAviso("🛒 Sacola Vazia", "A sua sacola de compras está vazia! Adicione algum hambúrguer ou bebida antes de enviar para a cozinha.");
                return;
            }

            console.log("🚀 Enviando sacola de compras para o servidor...", carrinho);

            fetch("http://localhost:3000/api/pedidos/enviar", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ mesa: mesaNumero, itens: carrinho })
            })
            .then(resposta => resposta.json())
            .then(dados => {
                if (dados.sucesso) {
                    document.getElementById('tela-sucesso-pedido').classList.add('modal-visivel');
                    carrinho = [];
                    atualizarResumoCarrinho();

                    setTimeout(() => {
                        window.location.href = "portal.html";
                    }, 3000);
                } else {
                    mostrarCortinaAviso("❌ Erro no Pedido", "Erro ao enviar pedido: " + dados.erro);
                }
            })
            .catch(erro => {
                console.error("Erro na comunicação com a cozinha:", erro);
                mostrarCortinaAviso("❌ Erro de Conexão", "Não foi possível conectar ao servidor da cozinha. Verifique se o servidor está ligado.");
            });
        }

        // 🧠 FUNÇÃO AUXILIAR: Abre a cortina de avisos personalizada
        function mostrarCortinaAviso(titulo, texto) {
            document.getElementById('tela-aviso-cardapio').classList.add('modal-visivel');
            document.getElementById('aviso-titulo').innerText = titulo;
            document.getElementById('aviso-texto').innerText = texto;
        }

        // 🟢 FUNÇÃO AUXILIAR: Fecha a cortina de avisos
        function fecharCortinaAviso() {
            document.getElementById('tela-aviso-cardapio').classList.remove('modal-visivel');
        }

        // ⏳ FUNÇÃO 4: Carregamento inicial da página (Higienizada e sem alerts cinzas!)
        window.onload = function() {
            const mesaNumero = localStorage.getItem('id_mesa_configurada');
            if (mesaNumero) {
                document.getElementById('mesa-display').innerText = "Mesa " + mesaNumero;
            }

            fetch("http://localhost:3000/api/cardapio")
            .then(resposta => resposta.json())
            .then(produtosDoBanco => {
                console.log("Produtos carregados do MariaDB:", produtosDoBanco);
                todosOsProdutos = produtosDoBanco;
                renderizarProdutos(todosOsProdutos);
                atualizarResumoCarrinho(); 
            })
            .catch(erro => {
                console.error("Erro ao carregar cardápio:", erro);
                // 🟢 MUDANÇA MASTER: Trocado alert() travável pela cortina nativa estilizada do salão
                mostrarCortinaAviso("❌ Erro de Sincronia", "Não foi possível carregar os itens do cardápio ativo no banco de dados.");
            });

            if (mesaNumero) {
                setInterval(checarStatusChamado, 5000);
            }
        }

        // 🎨 FUNÇÃO 5: Renderizar os cards HTML dinamicamente (Com os botões de + e -)
        function renderizarProdutos(listaDeProdutos) {
            const container = document.getElementById('container-produtos');
            container.innerHTML = "";

            if (listaDeProdutos.length === 0) {
                container.innerHTML = "<p>Nenhum produto cadastrado nesta categoria.</p>";
                return;
            }

            listaDeProdutos.forEach(produto => {

                // 🟢 Injetados botões de controle de quantidade e ID dinâmico por input
                const cardHTML = `
                    <div class="produto-card">
                        <img src="${produto.imagem_url}" alt="${produto.nome_item}">
                        <h3>${produto.nome_item}</h3>
                        <p class="texto-secundario" style="height: 40px; overflow: hidden;">${produto.descricao || ''}</p>
                        <p class="valor-destaque">R$ ${Number(produto.preco).toFixed(2)}</p>
                        
                        <div class="seletor-qtd">
                            <button type="button" class="btn-qtd" onclick="alterarContadorVisual(${produto.id_item}, 'menos')">-</button>
                            <input type="text" id="qtd-${produto.id_item}" class="input-qtd" value="1" readonly>
                            <button type="button" class="btn-qtd" onclick="alterarContadorVisual(${produto.id_item}, 'mais')">+</button>
                        </div>

                        <button class="btn-add-sacola" onclick="adicionarAoCarrinho(${produto.id_item})">Adicionar</button>
                    </div>
                `;
                container.innerHTML += cardHTML;
            });
        }

        // 🔀 FUNÇÃO 6: Filtro de abas por categoria
        function filtrarCategoria(categoriaSelecionada) {
            console.log("Filtrando por:", categoriaSelecionada);
            if (categoriaSelecionada === 'Todos') {
                renderizarProdutos(todosOsProdutos);
            } else {
                const produtosFiltrados = todosOsProdutos.filter(p => p.categoria === categoriaSelecionada);
                renderizarProdutos(produtosFiltrados);
            }
        }

        // 🚨 FUNÇÃO 7 ATUALIZADA: Monitoramento contínuo usando Cortinas Visuais Nativas (Sem Alerts!)
        function checarStatusChamado() {
            const mesaNumero = localStorage.getItem('id_mesa_configurada');
            if (!mesaNumero) return;

            // 🟢 TRAVA DE SEGURANÇA MESTRE: Verifica se a conta foi paga no Caixa
            fetch(`http://localhost:3000/api/mesas/verificar-comanda/${mesaNumero}`)
            .then(resposta => resposta.json())
            .then(dadosMesa => {
                if (!dadosMesa.ativa) {
                    // Limpa a mesa da memória antes do redirecionamento
                    localStorage.removeItem('id_mesa_configurada');
                    
                    // 🟢 MUDANÇA MASTER: Exibe a sua cortina de aviso nativa e desvia em seguida
                    mostrarCortinaAviso(
                        "💳 Conta Encerrada!", 
                        "Obrigado pela preferência, sua mesa foi liberada no caixa. Volte sempre!\n\nEncerrando sessão do dispositivo..."
                    );
                    
                    setTimeout(() => {
                        window.location.href = "index.html";
                    }, 4000);
                    return;
                }
            })
            .catch(erro => console.error("Erro na trava de segurança da mesa:", erro));

            // Continua o monitoramento do garçom vindo...
            if (alertaExibido) return;
            fetch(`http://localhost:3000/api/garcons/status-mesa/${mesaNumero}`)
            .then(resposta => resposta.json())
            .then(dados => {
                if (dados.ativo) {
                    alertaExibido = true;
                    
                    // 🟢 MUDANÇA MASTER: Substituído o alert() travável pela cortina nativa estilizada do portal
                    const nomeGarcom = dados.garcom || "da equipe";
                    mostrarCortinaAviso(
                        "🛎️ Atendimento Confirmado!", 
                        `O garçom ${nomeGarcom} já aceitou sua solicitação e está a caminho da sua mesa para te atender.`
                    );
                    
                    setTimeout(() => { alertaExibido = false; }, 15000);
                }
            })
            .catch(erro => console.error("Erro no monitor de chamados:", erro));
        }

        // 📑 FUNÇÃO 8 ATUALIZADA: Buscar o extrato real acumulado no banco de dados (Sem Alerts!)
        function carregarExtratoMesa() {
            const mesaNumero = localStorage.getItem('id_mesa_configurada');
            const divDetalhe = document.getElementById('detalhe-extrato');

            if (divDetalhe.style.display === 'block') {
                divDetalhe.style.display = 'none';
                return;
            }

            console.log("🧾 Solicitando extrato de consumo para a mesa...");

            fetch(`http://localhost:3000/api/pedidos/extrato/${mesaNumero}`)
            .then(resposta => resposta.json())
            .then(dados => {
                if (dados.sucesso) {
                    divDetalhe.style.display = 'block';
                    
                    if (!dados.itens_consumidos || dados.itens_consumidos.length === 0) {
                        divDetalhe.innerHTML = "<p class='texto-secundario' style='text-align: center; padding: 10px 0;'>Você ainda não enviou nenhum pedido nesta comanda.</p>";
                        return;
                    }

                    let linhasHTML = "<h4>📋 Consumo Acumulado no Banco:</h4><ul class='extrato-lista'>";
                    dados.itens_consumidos.forEach(item => {
                        linhasHTML += `<li><strong>${item.quantidade_total}x</strong> ${item.nome_item || item.nome} - R$ ${Number(item.subtotal_item).toFixed(2)}</li>`;
                    });
                    linhasHTML += "</ul>";

                    linhasHTML += `
                        <div class="extrato-total">
                            <p>Valor Total da Conta:</p>
                            <strong>R$ ${Number(dados.total_geral).toFixed(2)}</strong>
                            <button onclick="chamarGarcomParaConta()" class="btn-pill-sm" style="width: 100%; margin-top: 14px;">💳 Chamar Garçom com a Maquininha</button>
                        </div>
                    `;

                    divDetalhe.innerHTML = linhasHTML;
                }
            })
            .catch(erro => {
                console.error("Erro ao puxar extrato:", erro);
                // 🟢 MUDANÇA MASTER: Notifica o erro usando a cortina sem congelar a tela
                mostrarCortinaAviso("❌ Erro no Extrato", "Não foi possível carregar os valores acumulados da sua conta. Verifique a rede.");
            });
        }

        // 💳 FUNÇÃO 9: Solicitar encerramento de mesa ao salão e voltar ao portal automaticamente
        function chamarGarcomParaConta() {
            const mesaNumero = localStorage.getItem('id_mesa_configurada');
            
            fetch("http://localhost:3000/api/mesas/solicitar-maquininha", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ mesa: mesaNumero })
            })
            .then(res => res.json())
            .then(dados => {
                mostrarCortinaAviso("💳 Maquininha Solicitada", "Solicitação enviada com sucesso!\nO garçom foi acionado no salão e está trazendo a maquininha de cartão até a sua mesa.\n\nRetornando ao portal principal...");
                
                setTimeout(() => {
                    window.location.href = "portal.html";
                }, 4000);
            })
            .catch(erro => {
                console.error("Erro ao chamar conta:", erro);
                mostrarCortinaAviso("❌ Erro", "Não foi possível chamar o garçom para o pagamento. Tente novamente.");
            });
        }


    </script>
</body>
</html>
