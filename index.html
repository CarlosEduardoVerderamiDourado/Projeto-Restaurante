<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ratatue - Autenticação</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h2>Ratatue Sistema</h2>
        
        <!-- Botões de Alternância (Abas) -->
        <div class="tabs">
            <button class="tab-btn active" onclick="alternarAba('mesa')">Configurar Mesa</button>
            <button class="tab-btn" onclick="alternarAba('funcionario')">Funcionário</button>
        </div>

        <!-- FORMULÁRIO 1: ATIVAÇÃO DA MESA -->
        <form id="form-mesa" class="form-panel active" onsubmit="activarMesa(event)">
            <div class="form-group">
                <label for="numero-mesa">Número da Mesa:</label>
                <input type="number" id="numero-mesa" placeholder="Ex: 5" required>
            </div>
            <div class="form-group">
                <label for="senha-gerente">Senha do Gerente:</label>
                <input type="password" id="senha-gerente" placeholder="••••" required>
            </div>
            <button type="submit" class="btn-submit">Ativar Dispositivo</button>
        </form>

        <!-- FORMULÁRIO 2: LOGIN DE FUNCIONÁRIOS -->
        <form id="form-funcionario" class="form-panel" onsubmit="loginFuncionario(event)">
            <div class="form-group">
                <label for="login-user">Usuário / Login:</label>
                <input type="text" id="login-user" placeholder="carlos.garcom" required>
            </div>
            <div class="form-group">
                <label for="senha-user">Senha:</label>
                <input type="password" id="senha-user" placeholder="••••" required>
            </div>
            <button type="submit" class="btn-submit">Entrar no Painel</button>
        </form>
    </div>

    <!-- 🧠 LÓGICA JAVASCRIPT -->
    <script>
        // 1. Função para trocar visualmente entre as abas (Perfeito)
function alternarAba(tipo) {
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    document.querySelectorAll('.form-panel').forEach(panel => panel.classList.remove('active'));
    
    if (tipo === 'mesa') {
        document.querySelectorAll('.tab-btn')[0].classList.add('active');
        document.getElementById('form-mesa').classList.add('active');
    } else {
        document.querySelectorAll('.tab-btn')[1].classList.add('active');
        document.getElementById('form-funcionario').classList.add('active');
    }
}

// 2. Ação ao enviar o formulário da MESA
function activarMesa(event) {
    event.preventDefault(); 
    
    const mesa = document.getElementById('numero-mesa').value;
    const senha = document.getElementById('senha-gerente').value;

    console.log("Tentando ativar dispositivo...");

    // 🟢 ENVIANDO DIRETO PARA O BACKEND (Sem alertas falsos aqui)
    fetch("http://localhost:3000/api/mesas/ativar",{
        method: "POST",
        headers:{
            "Content-Type": "application/json" // 🟢 Ajustado para C maiúsculo
        },
        body: JSON.stringify({ mesa, senha })
    })
    .then(resposta => resposta.json()) 
    .then(dados => {
        if (dados.sucesso) {
            alert(dados.mensagem);
            localStorage.setItem('id_mesa_configurada', mesa); // 🟢 Salva apenas no sucesso real
            console.log("Mandar para a tela de:", dados.cargo);
            window.location.href = "portal.html";

        } else {
            alert(dados.mensagem); 
        }
    })
    .catch(erro => {
        console.error("Erro na comunicação:", erro);
        alert("Não foi possível conectar ao servidor.");
    });
}

// 3. Ação ao enviar o formulário do FUNCIONÁRIO
// 3. Ação ao enviar o formulário do FUNCIONÁRIO (Corrigida!)
function loginFuncionario(event) {
    event.preventDefault();
    
    const usuario = document.getElementById('login-user').value;
    const senha = document.getElementById('senha-user').value;

    console.log("Tentando logar funcionário...");

    fetch("http://localhost:3000/api/funcionarios/login", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({ usuario, senha })
    })
    .then(resposta => resposta.json())
    .then(dados => {
        if (dados.sucesso) {
            alert(dados.mensagem); 
            
            // 🟢 1. GRAVA O ID REAL DO FUNCIONÁRIO NA MEMÓRIA LOCAL
            localStorage.setItem('id_funcionario_logado', dados.id_funcionario);
            
            // 🟢 A LINHA SALVADORA: Grava o cargo retornado do banco ('Garçom', 'Cozinheiro', etc.) na memória!
            localStorage.setItem('cargo', dados.cargo);
            
            console.log("Funcionário autenticado! ID:", dados.id_funcionario, "Cargo:", dados.cargo);

            // 🟢 2. A LÓGICA DE ENTRADA AUTOMÁTICA POR CARGO
            if (dados.cargo === 'Garçom') {
                window.location.href = "garcons.html";
            } else if (dados.cargo === 'Cozinheiro') {
                window.location.href = "cozinha.html";
            } else if (dados.cargo === 'Barman') {
                window.location.href = "bar.html";
            } else if (dados.cargo === 'Caixa' || dados.cargo === 'Administrador') {
                window.location.href = "adm.html";
            } else {
                alert("Cargo não reconhecido no painel. Contate o suporte.");
            }

        } else {
            alert(dados.mensagem); 
        }
    })
    .catch(erro => {
        console.error("Erro na comunicação:", erro);
        alert("Não foi possível conectar ao servidor.");
    });
}


// 4. O GUARDA DE TRÂNSITO (Higienizado e sem Pop-ups cinzas!)
window.onload = function() {
    const mesaSalva = localStorage.getItem('id_mesa_configurada');
    if (mesaSalva) {
        console.log(`Mesa ${mesaSalva} já configurada na memória. Redirecionando para o portal...`);
        // Viaja direto para o portal de forma profissional sem travar o usuário com alertas
        window.location.href = "portal.html";
    }
}


    </script>
</body>
</html>
