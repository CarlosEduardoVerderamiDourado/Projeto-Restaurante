<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ratatue - Painel do Garçom</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; }
        .secao { margin-bottom: 40px; border-bottom: 2px solid #eee; padding-bottom: 20px; }
        .painel-cards { display: flex; flex-wrap: wrap; gap: 15px; padding: 10px 0; }
        .card-chamado {
            border: 2px solid #333; border-radius: 8px; padding: 15px;
            background-color: #fffde7; width: 220px; box-shadow: 2px 2px 10px rgba(0,0,0,0.1); text-align: center;
        }
        .card-entrega {
            border: 2px solid #28a745; border-radius: 8px; padding: 15px;
            background-color: #e8f5e9; width: 220px; box-shadow: 2px 2px 10px rgba(0,0,0,0.1); text-align: center;
        }
        .btn-acao { color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px; }
        .btn-azul { background-color: #007bff; } .btn-azul:hover { background-color: #0056b3; }
        .btn-verde { background-color: #28a745; } .btn-verde:hover { background-color: #218838; }
    </style>
</head>
<body>

        <!-- 🚨 CORTINA DE CONFIRMAÇÃO VISUAL (Garante o funcionamento do botão de Sair!) -->
    <div id="tela-confirmacao-garcom" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); color: white; z-index: 9999; text-align: center; padding-top: 15%;">
        <div style="background: #222; display: inline-block; padding: 30px; border-radius: 10px; border: 2px solid #007bff; max-width: 400px;">
            <h2 id="confirm-titulo" style="color: #007bff; font-size: 24px; margin: 0;">🚪 Sair do Sistema</h2>
            <p id="confirm-texto" style="font-size: 18px; margin: 20px 0;">Deseja realmente encerrar a sua sessão de trabalho?</p>
            <div style="display: flex; gap: 15px; justify-content: center;">
                <button id="btn-confirm-sim" style="padding: 10px 20px; background: #28a745; color: white; border: none; font-weight: bold; border-radius: 4px; cursor: pointer;">Sim</button>
                <button id="btn-confirm-nao" style="padding: 10px 20px; background: #dc3545; color: white; border: none; font-weight: bold; border-radius: 4px; cursor: pointer;">Não</button>
            </div>
        </div>
    </div>

    <!-- 🚨 CORTINA DE EXTRATO (Exclusiva para o Garçom conferir a conta no Pedido de Conta) -->
<div id="tela-extrato-garcom" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); color: white; z-index: 9999; text-align: center; padding-top: 10%;">
    <div style="background: #222; display: inline-block; padding: 30px; border-radius: 10px; border: 2px solid #ff9800; max-width: 450px; text-align: left;">
        <h2 style="color: #ff9800; font-size: 24px; margin: 0 0 15px 0; text-align: center;">🧾 Extrato da Comanda</h2>
        <h3 id="extrato-mesa-titulo" style="margin: 0 0 15px 0; text-align: center;">Mesa X</h3>
        
        <div id="conteudo-extrato-garcom" style="background: #fff; color: #333; padding: 15px; border-radius: 6px; max-height: 250px; overflow-y: auto; margin-bottom: 20px;">
            Carregando consumo...
        </div>

        <div style="display: flex; gap: 15px; justify-content: center;">
            <button onclick="fecharExtratoGarcom()" style="padding: 10px 20px; background: #6c757d; color: white; border: none; font-weight: bold; border-radius: 4px; cursor: pointer;">Voltar ao Salão</button>
        </div>
    </div>
</div>



    <h1>🛎️ Painel Operacional do Garçom</h1>
    <button onclick="fazerLogoutGarcom()" style="padding: 6px 12px; background-color: #dc3545; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; margin-bottom: 20px;">🚪 Sair / Deslogar</button>

    <!-- CONTAINER 1: CHAMADOS DE SOCORRO -->
    <div class="secao">
        <h2>🚨 Chamados de Ajuda (Mesas Solicitando Garçom)</h2>
        <div id="container-chamados" class="painel-cards"></div>
    </div>

    <!-- CONTAINER 2: FILA DE PRATOS PRONTOS PARA ENTREGA -->
    <div class="secao">
        <h2>🍳 Fila de Entregas (Pratos Prontos na Cozinha/Bar)</h2>
        <div id="container-entregas" class="painel-cards"></div>
    </div>

    <script>
// 🛡️ GUARDA DE SEGURANÇA IMUNE A CAIXA ALTA/BAIXA: Valida 'Garçom', 'garçom', 'GARÇOM'
(function() {
    const idLogado = localStorage.getItem('id_funcionario_logado');
    let cargoLogado = localStorage.getItem('cargo');

    console.log("🕵️‍♂️ SEGURANÇA: Validando acesso ao salão...");
    console.log("ID na memória:", idLogado, "| Cargo na memória:", cargoLogado);

    // Se o cargo veio do banco, sanitiza a string forçando ficar tudo minúsculo
    if (cargoLogado) {
        cargoLogado = cargoLogado.trim().toLowerCase();
    }

    // 🟢 TRAVA INTELIGENTE: Aceita qualquer variação com ou sem acento/cedilha por segurança!
    if (!idLogado || (cargoLogado !== 'garçom' && cargoLogado !== 'garcom')) {
        console.warn("🚨 ACESSO RESTRITO: Credenciais inválidas para o painel de garçons!");
        alert("Acesso restrito! Por favor, faça login com uma conta de Garçom.");
        window.location.href = "index.html";
    }
})();



        // 🔄 Polling Automático - Sincroniza o salão inteiro a cada 5 segundos
        window.onload = function() {
            carregarDadosSalao();
            setInterval(carregarDadosSalao, 5000); 
        }

        function carregarDadosSalao() {
            carregarChamadosPendentes();
            carregarEntregasProntas();
        }

        // 📥 1. Buscar os chamados 'Pendentes'
        function carregarChamadosPendentes() {
            fetch("http://localhost:3000/api/garcons/chamados")
            .then(res => res.json())
            .then(chamados => renderizarChamados(chamados))
            .catch(erro => console.error("Erro ao carregar chamados:", erro));
        }

                // 🎨 Desenhar cards diferenciando AJUDA (Pendente) de CONTA (Pagamento) de forma limpa!
        function renderizarChamados(listaDeChamados) {
            const container = document.getElementById('container-chamados');
            container.innerHTML = "";
            if (listaDeChamados.length === 0) { container.innerHTML = "<p>Nenhuma mesa chamando no momento.</p>"; return; }

            listaDeChamados.forEach(ch => {
                const horaChamado = new Date(ch.horario_chamado);
                const diferencaMinutos = Math.floor((new Date() - horaChamado) / 1000 / 60);

                // 🟢 SEPARAÇÃO VISUAL POR STATUS DO CÓDIGO:
                let corCard = "#fffde7"; // Amarelo clássico para ajuda comum
                let textoTipo = "🛎️ Chamado de Ajuda";
                let bordaCard = "2px solid #333";

                // Se o status gravado pelo botão for 'Pagamento', o card muda na hora!
                if (ch.status_chamado === 'Pagamento') {
                    corCard = "#ffeacc"; // Laranja suave financeiro
                    textoTipo = "💳 PEDIDO DE CONTA (Levar Maquininha)";
                    bordaCard = "2px dashed #ff9800";
                }

                container.innerHTML += `
                    <div class="card-chamado" style="background-color: ${corCard}; border: ${bordaCard}; text-align: center; padding: 15px; width: 220px; border-radius: 8px;">
                        <h4 style="margin: 0 0 10px 0; color: #555; font-size: 11px; font-weight: bold; text-transform: uppercase;">${textoTipo}</h4>
                        <h3>Mesa ${ch.id_mesa}</h3>
                        <p>Aguardando há: <strong>${diferencaMinutos} min</strong></p>
                        <button class="btn-acao btn-azul" onclick="atenderMesa(${ch.id_chamado}, ${ch.id_mesa})" style="padding: 8px; background: #007bff; color: white; border: none; cursor: pointer; font-weight: bold; border-radius: 4px; width: 100%;">Atender</button>
                    </div>
                `;
            });
        }


        // 📥 2. Buscar os pratos 'Prontos' vindo da Cozinha/Bar
        function carregarEntregasProntas() {
            fetch("http://localhost:3000/api/garcons/entregas-pendentes")
            .then(res => res.json())
            .then(entregas => renderizarEntregas(entregas))
            .catch(erro => console.error("Erro ao carregar entregas:", erro));
        }

        // 🎨 Desenhar cards de entregas de comida (Garante o clique do botão verde!)
        function renderizarEntregas(listaDeEntregas) {
            const container = document.getElementById('container-entregas');
            container.innerHTML = "";
            if (listaDeEntregas.length === 0) { container.innerHTML = "<p>Nenhum prato aguardando entrega nas esteiras.</p>"; return; }

            listaDeEntregas.forEach(ent => {
                // 🟢 CORREÇÃO: Garante o mapeamento cirúrgico de ent.id_pedido e ent.id_mesa no onclick do botão verde!
                container.innerHTML += `
                    <div class="card-entrega" style="border: 2px solid #28a745; border-radius: 8px; padding: 15px; background-color: #e8f5e9; width: 220px; box-shadow: 2px 2px 10px rgba(0,0,0,0.1); text-align: center; display: inline-block; margin-right: 15px;">
                        <h3>Mesa ${ent.id_mesa}</h3>
                        <p>Pedido: <strong>#${ent.id_pedido}</strong></p>
                        <p style="color: green; font-weight: bold;">🍽️ PRATO PRONTO!</p>
                        <button class="btn-acao btn-verde" onclick="finalizarEntregaMesa(${ent.id_pedido}, ${ent.id_mesa})" style="background-color: #28a745; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px;">Confirmar Entrega</button>
                    </div>
                `;
            });
        }


        // 🏃‍♂️ AÇÃO A: Aceitar Chamado com Desvio Inteligente (Ajuda -> Cardápio | Conta -> Extrato Visual)
        function atenderMesa(id_chamado, id_mesa) {
            const id_funcionario = localStorage.getItem('id_funcionario_logado');

            // Vascula os chamados carregados para descobrir qual é o status desse card específico
            const cardClicado = document.getElementById('container-chamados').innerHTML;
            
            // 🟢 TRUQUE DE CÓDIGO: Descobre se o card clicado é de Pagamento olhando o texto do tipo
            const ehPedidoDeConta = cardClicado.includes("PEDIDO DE CONTA");

            document.getElementById('tela-confirmacao-garcom').style.display = 'block';
            document.getElementById('confirm-titulo').innerText = "🛎️ Atender Mesa " + id_mesa;
            document.getElementById('confirm-texto').innerText = ehPedidoDeConta 
                ? `Você confirma que vai levar a maquininha e fechar a conta da Mesa ${id_mesa}?`
                : `Você confirma que vai até o salão prestar atendimento para a Mesa ${id_mesa}?`;

            document.getElementById('btn-confirm-sim').onclick = function() {
                document.getElementById('tela-confirmacao-garcom').style.display = 'none';

                fetch("http://localhost:3000/api/garcons/aceitar-chamado", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ id_chamado, id_funcionario })
                })
                .then(res => res.json())
                .then(dados => {
                    if (dados.sucesso) {
                        // 🔀 O DESVIO INTELIGENTE DE NEGÓCIO:
                        if (ehPedidoDeConta) {
                            // 💳 CENÁRIO CONTA: Fica na tela e abre o extrato detalhado com os valores!
                            buscarEExibirExtratoMesa(id_mesa);
                        } else {
                            // 🛎️ CENÁRIO AJUDA: Leva direto para o cardápio para tirar o novo pedido!
                            localStorage.setItem('id_mesa_configurada', id_mesa);
                            window.location.href = "cardapio.html"; 
                        }
                    }
                })
                .catch(erro => console.error("Erro ao atender chamado:", erro));
            };

            document.getElementById('btn-confirm-nao').onclick = function() {
                document.getElementById('tela-confirmacao-garcom').style.display = 'none';
            };
        }

        // 🧠 FUNÇÃO NOVA: Puxa o consumo da comanda ativa direto do backend e monta na tela do garçom
        function buscarEExibirExtratoMesa(id_mesa) {
            const containerExtrato = document.getElementById('conteudo-extrato-garcom');
            document.getElementById('extrato-mesa-titulo').innerText = "Mesa " + id_mesa;
            document.getElementById('tela-extrato-garcom').style.display = 'block';
            containerExtrato.innerHTML = "<p>Carregando comanda...</p>";

            // Puxa a mesma rota de faturamento que o cliente usa!
            fetch(`http://localhost:3000/api/pedidos/extrato/${id_mesa}`)
            .then(res => res.json())
            .then(dados => {
                if (dados.sucesso) {
                    if (!dados.itens_consumidos || dados.itens_consumidos.length === 0) {
                        containerExtrato.innerHTML = "<p style='color: red;'>Nenhum item consumido nesta comanda ainda.</p>";
                        return;
                    }

                    let listaHTML = "<ul style='padding-left: 20px; margin: 0;'>";
                    dados.itens_consumidos.forEach(item => {
                        listaHTML += `<li style='margin-bottom: 8px;'><strong>${item.quantidade_total}x</strong> ${item.nome_item || item.nome} - R$ ${Number(item.subtotal_item).toFixed(2)}</li>`;
                    });
                    listaHTML += "</ul>";
                    
                    // Mostra o total destacado pro garçom digitar na maquininha
                    listaHTML += `
                        <div style='margin-top: 15px; padding-top: 10px; border-top: 2px solid #333; text-align: center;'>
                            <p style='font-size: 18px; margin: 0;'>Total da Conta:</p>
                            <h3 style='color: #d9534f; margin: 5px 0 0 0; font-size: 24px;'>R$ ${Number(dados.total_geral).toFixed(2)}</h3>
                        </div>
                    `;
                    containerExtrato.innerHTML = listaHTML;
                }
            })
            .catch(erro => {
                console.error("Erro ao buscar extrato para o garçom:", erro);
                containerExtrato.innerHTML = "<p style='color: red;'>Erro ao carregar os valores da comanda.</p>";
            });
        }

        function fecharExtratoGarcom() {
            document.getElementById('tela-extrato-garcom').style.display = 'none';
            carregarDadosSalao(); // Atualiza o salão limpo
        }
                // 🏃‍♂️ AÇÃO B: Dar baixa na entrega de comida (Disparada pelo botão verde clicável)
        function finalizarEntregaMesa(id_pedido, id_mesa) {
            console.log(`🏃‍♂️ Solicitando baixa de entrega para o Pedido #${id_pedido} na Mesa ${id_mesa}...`);

            fetch("http://localhost:3000/api/garcons/finalizar-entrega", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ id_pedido })
            })
            .then(res => res.json())
            .then(dados => {
                if (dados.sucesso) {
                    // Exibe a cortina estilizada de aviso do garçom em vez de alert cinza
                    document.getElementById('tela-aviso-garcom').style.display = 'block';
                    document.getElementById('aviso-titulo-garcom').innerText = "🍽️ Pedido Entregue";
                    document.getElementById('aviso-texto-garcom').innerHTML = `O pedido <strong>#${id_pedido}</strong> foi entregue com sucesso na Mesa ${id_mesa}!`;
                    
                    // 🔄 Recarrega o salão imediatamente para sumir com o card verde da tela!
                    carregarDadosSalao();
                }
            })
            .catch(erro => console.error("Erro ao finalizar entrega:", erro));
        }



        // 🚪 AÇÃO C: Fazer Logout com Limpeza Suprema de Memória
        function fazerLogoutGarcom() {
            // Abre o painel preto que adicionamos no Passo 1
            document.getElementById('tela-confirmacao-garcom').style.display = 'block';
            document.getElementById('confirm-titulo').innerText = "🚪 Sair do Sistema";
            document.getElementById('confirm-texto').innerText = "Deseja realmente encerrar a sua sessão de trabalho e limpar o histórico de mesas deste aparelho?";

            // Configura o botão do SIM para limpar tudo e voltar pro login
            document.getElementById('btn-confirm-sim').onclick = function() {
                localStorage.removeItem('id_funcionario_logado');
                localStorage.removeItem('id_mesa_configurada');
                localStorage.removeItem('id_mesa_garcom');

                console.log("Memória limpa com sucesso. Retornando ao Login...");
                window.location.href = "index.html";
            };

            // Configura o botão do NÃO para apenas fechar a janela
            document.getElementById('btn-confirm-nao').onclick = function() {
                document.getElementById('tela-confirmacao-garcom').style.display = 'none';
            };
        }

    </script>
</body>
</html>
