<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ratatue - Painel do Garçom</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; }
        .secao { margin-bottom: 40px; border-bottom: 2px solid #eee; padding-bottom: 20px; }
        .painel-cards { display: flex; flex-wrap: wrap; gap: 15px; padding: 10px 0; }
        .card-chamado {
            border: 2px solid #333; border-radius: 8px; padding: 15px;
            background-color: #fffde7; width: 220px; box-shadow: 2px 2px 10px rgba(0,0,0,0.1); text-align: center;
        }
        .card-entrega {
            border: 2px solid #28a745; border-radius: 8px; padding: 15px;
            background-color: #e8f5e9; width: 220px; box-shadow: 2px 2px 10px rgba(0,0,0,0.1); text-align: center;
        }
        .btn-acao { color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px; }
        .btn-azul { background-color: #007bff; } .btn-azul:hover { background-color: #0056b3; }
        .btn-verde { background-color: #28a745; } .btn-verde:hover { background-color: #218838; }
    </style>
</head>
<body>

    <h1>🛎️ Painel Operacional do Garçom</h1>
    <button onclick="fazerLogoutGarcom()" style="padding: 6px 12px; background-color: #dc3545; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; margin-bottom: 20px;">🚪 Sair / Deslogar</button>

    <!-- CONTAINER 1: CHAMADOS DE SOCORRO -->
    <div class="secao">
        <h2>🚨 Chamados de Ajuda (Mesas Solicitando Garçom)</h2>
        <div id="container-chamados" class="painel-cards"></div>
    </div>

    <!-- CONTAINER 2: FILA DE PRATOS PRONTOS PARA ENTREGA -->
    <div class="secao">
        <h2>🍳 Fila de Entregas (Pratos Prontos na Cozinha/Bar)</h2>
        <div id="container-entregas" class="painel-cards"></div>
    </div>

    <script>
        // 🔄 Polling Automático - Sincroniza o salão inteiro a cada 5 segundos
        window.onload = function() {
            carregarDadosSalao();
            setInterval(carregarDadosSalao, 5000); 
        }

        function carregarDadosSalao() {
            carregarChamadosPendentes();
            carregarEntregasProntas();
        }

        // 📥 1. Buscar os chamados 'Pendentes'
        function carregarChamadosPendentes() {
            fetch("http://localhost:3000/api/garcons/chamados")
            .then(res => res.json())
            .then(chamados => renderizarChamados(chamados))
            .catch(erro => console.error("Erro ao carregar chamados:", erro));
        }

                // 🎨 Desenhar cards diferenciando AJUDA (Pendente) de CONTA (Pagamento) de forma limpa!
        function renderizarChamados(listaDeChamados) {
            const container = document.getElementById('container-chamados');
            container.innerHTML = "";
            if (listaDeChamados.length === 0) { container.innerHTML = "<p>Nenhuma mesa chamando no momento.</p>"; return; }

            listaDeChamados.forEach(ch => {
                const horaChamado = new Date(ch.horario_chamado);
                const diferencaMinutos = Math.floor((new Date() - horaChamado) / 1000 / 60);

                // 🟢 SEPARAÇÃO VISUAL POR STATUS DO CÓDIGO:
                let corCard = "#fffde7"; // Amarelo clássico para ajuda comum
                let textoTipo = "🛎️ Chamado de Ajuda";
                let bordaCard = "2px solid #333";

                // Se o status gravado pelo botão for 'Pagamento', o card muda na hora!
                if (ch.status_chamado === 'Pagamento') {
                    corCard = "#ffeacc"; // Laranja suave financeiro
                    textoTipo = "💳 PEDIDO DE CONTA (Levar Maquininha)";
                    bordaCard = "2px dashed #ff9800";
                }

                container.innerHTML += `
                    <div class="card-chamado" style="background-color: ${corCard}; border: ${bordaCard}; text-align: center; padding: 15px; width: 220px; border-radius: 8px;">
                        <h4 style="margin: 0 0 10px 0; color: #555; font-size: 11px; font-weight: bold; text-transform: uppercase;">${textoTipo}</h4>
                        <h3>Mesa ${ch.id_mesa}</h3>
                        <p>Aguardando há: <strong>${diferencaMinutos} min</strong></p>
                        <button class="btn-acao btn-azul" onclick="atenderMesa(${ch.id_chamado}, ${ch.id_mesa})" style="padding: 8px; background: #007bff; color: white; border: none; cursor: pointer; font-weight: bold; border-radius: 4px; width: 100%;">Atender</button>
                    </div>
                `;
            });
        }


        // 📥 2. Buscar os pratos 'Prontos' vindo da Cozinha/Bar
        function carregarEntregasProntas() {
            fetch("http://localhost:3000/api/garcons/entregas-pendentes")
            .then(res => res.json())
            .then(entregas => renderizarEntregas(entregas))
            .catch(erro => console.error("Erro ao carregar entregas:", erro));
        }

        // 🎨 Desenhar cards de entregas
        function renderizarEntregas(listaDeEntregas) {
            const container = document.getElementById('container-entregas');
            container.innerHTML = "";
            if (listaDeEntregas.length === 0) { container.innerHTML = "<p>Nenhum prato aguardando entrega nas esteiras.</p>"; return; }

            listaDeEntregas.forEach(ent => {
                container.innerHTML += `
                    <div class="card-entrega">
                        <h3>Mesa ${ent.id_mesa}</h3>
                        <p>Pedido: <strong>#${ent.id_pedido}</strong></p>
                        <p style="color: green; font-weight: bold;">🍽️ PRATO PRONTO!</p>
                        <button class="btn-acao btn-verde" onclick="finalizarEntregaMesa(${ent.id_pedido}, ${ent.id_mesa})">Confirmar Entrega</button>
                    </div>
                `;
            });
        }

                // 🏃‍♂️ AÇÃO A: Aceitar Chamado (Totalmente livre de pop-ups cinzas!)
                // 🏃‍♂️ AÇÃO A: Aceitar Chamado + Viagem Automática para a Tela da Mesa!
        function atenderMesa(id_chamado, id_mesa) {
            const id_funcionario = localStorage.getItem('id_funcionario_logado');

            // 1. Configura a nossa cortina de confirmação preta e azul personalizada
            document.getElementById('tela-confirmacao-garcom').style.display = 'block';
            document.getElementById('confirm-titulo').innerText = "🛎️ Atender Mesa " + id_mesa;
            document.getElementById('confirm-texto').innerText = `Você confirma que vai até o salão prestar atendimento para a Mesa ${id_mesa}?`;

            // 2. Configura a ação se o Garçom clicar em "SIM" na nossa cortina
            document.getElementById('btn-confirm-sim').onclick = function() {
                document.getElementById('tela-confirmacao-garcom').style.display = 'none';

                fetch("http://localhost:3000/api/garcons/aceitar-chamado", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ id_chamado, id_funcionario })
                })
                .then(res => res.json())
                .then(dados => {
                    if (dados.sucesso) {
                        console.log(`Atendimento aceito para a Mesa ${id_mesa}! Configurando trânsito...`);
                        
                        // 🟢 A NOVA MÁGICA AUTOMÁTICA:
                        // 1. Salva o número da mesa aceita na memória do aparelho do garçom
                        localStorage.setItem('id_mesa_configurada', id_mesa);
                        
                        // 2. Empurra o garçom direto para a tela de vendas da mesa do cliente!
                        window.location.href = "portal.html"; 
                    }
                })
                .catch(erro => console.error("Erro ao atender chamado:", erro));
            };

            // 3. Configura a ação se o Garçom clicar em "NÃO" na nossa cortina
            document.getElementById('btn-confirm-nao').onclick = function() {
                document.getElementById('tela-confirmacao-garcom').style.display = 'none';
            };
        }




        // 🏃‍♂️ AÇÃO B: Dar baixa na entrega de comida
        function finalizarEntregaMesa(id_pedido, id_mesa) {
            fetch("http://localhost:3000/api/garcons/finalizar-entrega", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ id_pedido })
            })
            .then(res => res.json())
            .then(dados => {
                alert(`Pedido entregue com sucesso na Mesa ${id_mesa}!`);
                carregarDadosSalao();
            })
            .catch(erro => console.error("Erro ao finalizar entrega:", erro));
        }

        function fazerLogoutGarcom() {
            if (!confirm("Deseja encerrar sua sessão?")) return;
            localStorage.removeItem('id_funcionario_logado');
            window.location.href = "index.html";
        }
    </script>
</body>
</html>
