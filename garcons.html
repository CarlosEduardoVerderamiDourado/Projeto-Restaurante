<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ratatue - Painel do Garçom</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

        <!-- 🚨 CORTINA DE CONFIRMAÇÃO VISUAL (Garante o funcionamento do botão de Sair!) -->
    <div id="tela-confirmacao-garcom" class="modal-overlay">
        <div class="modal-caixa">
            <h2 id="confirm-titulo">🚪 Sair do Sistema</h2>
            <p id="confirm-texto">Deseja realmente encerrar a sua sessão de trabalho?</p>
            <div class="modal-botoes">
                <button id="btn-confirm-sim" class="modal-btn modal-btn-confirmar">Sim</button>
                <button id="btn-confirm-nao" class="modal-btn modal-btn-cancelar">Não</button>
            </div>
        </div>
    </div>

    <!-- 🚨 CORTINA DE EXTRATO (Exclusiva para o Garçom conferir a conta no Pedido de Conta) -->
<div id="tela-extrato-garcom" class="modal-overlay">
    <div class="modal-caixa">
        <h2>🧾 Extrato da Comanda</h2>
        <h3 id="extrato-mesa-titulo">Mesa X</h3>

        <div id="conteudo-extrato-garcom">
            Carregando consumo...
        </div>

        <div class="modal-botoes">
            <button onclick="fecharExtratoGarcom()" class="modal-btn modal-btn-cancelar">Voltar ao Salão</button>
        </div>
    </div>
</div>

    <!-- 🚨 CORTINA DE AVISO (confirmação de entrega concluída) -->
<div id="tela-aviso-garcom" class="modal-overlay">
    <div class="modal-caixa">
        <h2 id="aviso-titulo-garcom">Aviso</h2>
        <p id="aviso-texto-garcom">Mensagem aqui...</p>
        <button onclick="document.getElementById('tela-aviso-garcom').classList.remove('modal-visivel')" class="modal-btn modal-btn-confirmar">Ok, entendi</button>
    </div>
</div>

    <button onclick="fazerLogoutGarcom()" class="btn-logout">🚪 Sair</button>
    <h1>🛎️ Painel Operacional do Garçom</h1>

    <div class="painel-wrapper">
        <!-- COLUNA 1: CHAMADOS DE SOCORRO -->
        <div class="painel-coluna">
            <h2 class="painel-titulo">🚨 Chamados de Ajuda</h2>
            <div id="container-chamados" class="mesas-lista"></div>
        </div>

        <!-- COLUNA 2: FILA DE PRATOS PRONTOS PARA ENTREGA -->
        <div class="painel-coluna">
            <h2 class="painel-titulo">🍳 Fila de Entregas</h2>
            <div class="status-bloco status-pronto">
                <div class="status-titulo">Prontos na Cozinha/Bar</div>
                <div id="container-entregas" class="status-lista"></div>
            </div>
        </div>
    </div>

    <script>
// 🛡️ GUARDA DE SEGURANÇA IMUNE A CAIXA ALTA/BAIXA: Valida 'Garçom', 'garçom', 'GARÇOM'
(function() {
    const idLogado = localStorage.getItem('id_funcionario_logado');
    let cargoLogado = localStorage.getItem('cargo');

    console.log("🕵️‍♂️ SEGURANÇA: Validando acesso ao salão...");
    console.log("ID na memória:", idLogado, "| Cargo na memória:", cargoLogado);

    // Se o cargo veio do banco, sanitiza a string forçando ficar tudo minúsculo
    if (cargoLogado) {
        cargoLogado = cargoLogado.trim().toLowerCase();
    }

    // 🟢 TRAVA INTELIGENTE: Aceita qualquer variação com ou sem acento/cedilha por segurança!
    if (!idLogado || (cargoLogado !== 'garçom' && cargoLogado !== 'garcom')) {
        console.warn("🚨 ACESSO RESTRITO: Credenciais inválidas para o painel de garçons!");
        alert("Acesso restrito! Por favor, faça login com uma conta de Garçom.");
        window.location.href = "index.html";
    }
})();



        // 🔄 Polling Automático - Sincroniza o salão inteiro a cada 5 segundos
        window.onload = function() {
            carregarDadosSalao();
            setInterval(carregarDadosSalao, 5000); 
        }

        function carregarDadosSalao() {
            carregarChamadosPendentes();
            carregarEntregasProntas();
        }

        // 📥 1. Buscar os chamados 'Pendentes'
        function carregarChamadosPendentes() {
            fetch("http://localhost:3000/api/garcons/chamados")
            .then(res => res.json())
            .then(chamados => renderizarChamados(chamados))
            .catch(erro => console.error("Erro ao carregar chamados:", erro));
        }

                // 🎨 Desenhar cards diferenciando AJUDA (Pendente) de CONTA (Pagamento) de forma limpa!
        function renderizarChamados(listaDeChamados) {
            const container = document.getElementById('container-chamados');
            container.innerHTML = "";
            if (listaDeChamados.length === 0) { container.innerHTML = "<p class='sem-resultados'>Nenhuma mesa chamando no momento.</p>"; return; }

            listaDeChamados.forEach(ch => {
                const horaChamado = new Date(ch.horario_chamado);
                const diferencaMinutos = Math.floor((new Date() - horaChamado) / 1000 / 60);

                // 🟢 SEPARAÇÃO VISUAL POR STATUS DO CÓDIGO:
                // (o texto "PEDIDO DE CONTA" precisa continuar presente: atenderMesa() o usa pra identificar o tipo)
                const ehConta = ch.status_chamado === 'Pagamento';
                const classeTipo = ehConta ? 'tipo-conta' : '';
                const textoTipo = ehConta ? '💳 PEDIDO DE CONTA' : '🛎️ Chamado de Ajuda';

                container.innerHTML += `
                    <div class="mesa-atendimento-card ${classeTipo}">
                        <span class="chamado-tipo">${textoTipo}</span>
                        <span class="mesa-atendimento-numero">Mesa ${ch.id_mesa}</span>
                        <span class="chamado-tempo">Aguardando há ${diferencaMinutos} min</span>
                        <button class="btn-pill-sm" onclick="atenderMesa(${ch.id_chamado}, ${ch.id_mesa})">Atender</button>
                    </div>
                `;
            });
        }


        // 📥 2. Buscar os pratos 'Prontos' vindo da Cozinha/Bar
        function carregarEntregasProntas() {
            fetch("http://localhost:3000/api/garcons/entregas-pendentes")
            .then(res => res.json())
            .then(entregas => renderizarEntregas(entregas))
            .catch(erro => console.error("Erro ao carregar entregas:", erro));
        }

        // 🎨 Desenhar cards de entregas de comida (Garante o clique do botão verde!)
        function renderizarEntregas(listaDeEntregas) {
            const container = document.getElementById('container-entregas');
            container.innerHTML = "";
            if (listaDeEntregas.length === 0) { container.innerHTML = "<p class='sem-resultados'>Nenhum prato aguardando entrega nas esteiras.</p>"; return; }

            listaDeEntregas.forEach(ent => {
                // 🟢 CORREÇÃO: Garante o mapeamento cirúrgico de ent.id_pedido e ent.id_mesa no onclick do botão verde!
                container.innerHTML += `
                    <div class="pedido-card">
                        <div class="pedido-cabecalho">
                            <span class="pedido-mesa">Mesa ${ent.id_mesa} · Pedido #${ent.id_pedido}</span>
                        </div>
                        <p class="texto-secundario">🍽️ PRATO PRONTO!</p>
                        <button class="btn-pill-sm btn-pill-verde" onclick="finalizarEntregaMesa(${ent.id_pedido}, ${ent.id_mesa})" style="width: 100%;">Confirmar Entrega</button>
                    </div>
                `;
            });
        }


        // 🏃‍♂️ AÇÃO A: Aceitar Chamado com Desvio Inteligente (Ajuda -> Cardápio | Conta -> Extrato Visual)
        function atenderMesa(id_chamado, id_mesa) {
            const id_funcionario = localStorage.getItem('id_funcionario_logado');

            // Vascula os chamados carregados para descobrir qual é o status desse card específico
            const cardClicado = document.getElementById('container-chamados').innerHTML;
            
            // 🟢 TRUQUE DE CÓDIGO: Descobre se o card clicado é de Pagamento olhando o texto do tipo
            const ehPedidoDeConta = cardClicado.includes("PEDIDO DE CONTA");

            document.getElementById('tela-confirmacao-garcom').classList.add('modal-visivel');
            document.getElementById('confirm-titulo').innerText = "🛎️ Atender Mesa " + id_mesa;
            document.getElementById('confirm-texto').innerText = ehPedidoDeConta 
                ? `Você confirma que vai levar a maquininha e fechar a conta da Mesa ${id_mesa}?`
                : `Você confirma que vai até o salão prestar atendimento para a Mesa ${id_mesa}?`;

            document.getElementById('btn-confirm-sim').onclick = function() {
                document.getElementById('tela-confirmacao-garcom').classList.remove('modal-visivel');

                fetch("http://localhost:3000/api/garcons/aceitar-chamado", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ id_chamado, id_funcionario })
                })
                .then(res => res.json())
                .then(dados => {
                    if (dados.sucesso) {
                        // 🔀 O DESVIO INTELIGENTE DE NEGÓCIO:
                        if (ehPedidoDeConta) {
                            // 💳 CENÁRIO CONTA: Fica na tela e abre o extrato detalhado com os valores!
                            buscarEExibirExtratoMesa(id_mesa);
                        } else {
                            // 🛎️ CENÁRIO AJUDA: Leva direto para o cardápio para tirar o novo pedido!
                            localStorage.setItem('id_mesa_configurada', id_mesa);
                            window.location.href = "cardapio.html"; 
                        }
                    }
                })
                .catch(erro => console.error("Erro ao atender chamado:", erro));
            };

            document.getElementById('btn-confirm-nao').onclick = function() {
                document.getElementById('tela-confirmacao-garcom').classList.remove('modal-visivel');
            };
        }

        // 🧠 FUNÇÃO NOVA: Puxa o consumo da comanda ativa direto do backend e monta na tela do garçom
        function buscarEExibirExtratoMesa(id_mesa) {
            const containerExtrato = document.getElementById('conteudo-extrato-garcom');
            document.getElementById('extrato-mesa-titulo').innerText = "Mesa " + id_mesa;
            document.getElementById('tela-extrato-garcom').classList.add('modal-visivel');
            containerExtrato.innerHTML = "<p>Carregando comanda...</p>";

            // Puxa a mesma rota de faturamento que o cliente usa!
            fetch(`http://localhost:3000/api/pedidos/extrato/${id_mesa}`)
            .then(res => res.json())
            .then(dados => {
                if (dados.sucesso) {
                    if (!dados.itens_consumidos || dados.itens_consumidos.length === 0) {
                        containerExtrato.innerHTML = "<p class='sem-resultados'>Nenhum item consumido nesta comanda ainda.</p>";
                        return;
                    }

                    let listaHTML = "<ul class='extrato-lista'>";
                    dados.itens_consumidos.forEach(item => {
                        listaHTML += `<li><strong>${item.quantidade_total}x</strong> ${item.nome_item || item.nome} - R$ ${Number(item.subtotal_item).toFixed(2)}</li>`;
                    });
                    listaHTML += "</ul>";
                    
                    // Mostra o total destacado pro garçom digitar na maquininha
                    listaHTML += `
                        <div class="extrato-total">
                            <p>Total da Conta:</p>
                            <strong>R$ ${Number(dados.total_geral).toFixed(2)}</strong>
                        </div>
                    `;
                    containerExtrato.innerHTML = listaHTML;
                }
            })
            .catch(erro => {
                console.error("Erro ao buscar extrato para o garçom:", erro);
                containerExtrato.innerHTML = "<p class='sem-resultados'>Erro ao carregar os valores da comanda.</p>";
            });
        }

        function fecharExtratoGarcom() {
            document.getElementById('tela-extrato-garcom').classList.remove('modal-visivel');
            carregarDadosSalao(); // Atualiza o salão limpo
        }
                // 🏃‍♂️ AÇÃO B: Dar baixa na entrega de comida (Disparada pelo botão verde clicável)
        function finalizarEntregaMesa(id_pedido, id_mesa) {
            console.log(`🏃‍♂️ Solicitando baixa de entrega para o Pedido #${id_pedido} na Mesa ${id_mesa}...`);

            fetch("http://localhost:3000/api/garcons/finalizar-entrega", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ id_pedido })
            })
            .then(res => res.json())
            .then(dados => {
                if (dados.sucesso) {
                    // Exibe a cortina estilizada de aviso do garçom em vez de alert cinza
                    document.getElementById('tela-aviso-garcom').classList.add('modal-visivel');
                    document.getElementById('aviso-titulo-garcom').innerText = "🍽️ Pedido Entregue";
                    document.getElementById('aviso-texto-garcom').innerHTML = `O pedido <strong>#${id_pedido}</strong> foi entregue com sucesso na Mesa ${id_mesa}!`;
                    
                    // 🔄 Recarrega o salão imediatamente para sumir com o card verde da tela!
                    carregarDadosSalao();
                }
            })
            .catch(erro => console.error("Erro ao finalizar entrega:", erro));
        }



        // 🚪 AÇÃO C: Fazer Logout com Limpeza Suprema de Memória
        function fazerLogoutGarcom() {
            // Abre a cortina de confirmação
            document.getElementById('tela-confirmacao-garcom').classList.add('modal-visivel');
            document.getElementById('confirm-titulo').innerText = "🚪 Sair do Sistema";
            document.getElementById('confirm-texto').innerText = "Deseja realmente encerrar a sua sessão de trabalho e limpar o histórico de mesas deste aparelho?";

            // Configura o botão do SIM para limpar tudo e voltar pro login
            document.getElementById('btn-confirm-sim').onclick = function() {
                localStorage.removeItem('id_funcionario_logado');
                localStorage.removeItem('id_mesa_configurada');
                localStorage.removeItem('id_mesa_garcom');

                console.log("Memória limpa com sucesso. Retornando ao Login...");
                window.location.href = "index.html";
            };

            // Configura o botão do NÃO para apenas fechar a janela
            document.getElementById('btn-confirm-nao').onclick = function() {
                document.getElementById('tela-confirmacao-garcom').classList.remove('modal-visivel');
            };
        }

    </script>
</body>
</html>
