<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ratatue - Autenticação</title>

</head>
<body>

    <div class="container">
        <h2>Ratatue Sistema</h2>
        
        <!-- Botões de Alternância (Abas) -->
        <div class="tabs">
            <button class="tab-btn active" onclick="alternarAba('mesa')">Configurar Mesa</button>
            <button class="tab-btn" onclick="alternarAba('funcionario')">Funcionário</button>
        </div>

        <!-- FORMULÁRIO 1: ATIVAÇÃO DA MESA -->
        <form id="form-mesa" class="form-panel active" onsubmit="ativarMesa(event)">
            <div class="form-group">
                <label for="numero-mesa">Número da Mesa:</label>
                <input type="number" id="numero-mesa" placeholder="Ex: 5" required>
            </div>
            <div class="form-group">
                <label for="senha-gerente">Senha do Gerente:</label>
                <input type="password" id="senha-gerente" placeholder="••••" required>
            </div>
            <button type="submit" class="btn-submit">Ativar Dispositivo</button>
        </form>

        <!-- FORMULÁRIO 2: LOGIN DE FUNCIONÁRIOS -->
        <form id="form-funcionario" class="form-panel" onsubmit="loginFuncionario(event)">
            <div class="form-group">
                <label for="login-user">Usuário / Login:</label>
                <input type="text" id="login-user" placeholder="carlos.garcom" required>
            </div>
            <div class="form-group">
                <label for="senha-user">Senha:</label>
                <input type="password" id="senha-user" placeholder="••••" required>
            </div>
            <button type="submit" class="btn-submit">Entrar no Painel</button>
        </form>
    </div>

    <!-- 🧠 LÓGICA JAVASCRIPT -->
    <script>
        // 1. Função para trocar visualmente entre as abas
        function alternarAba(tipo) {
            // Remove a classe ativa de todos os botões e painéis
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.form-panel').forEach(panel => panel.classList.remove('active'));
            
            // Adiciona a classe ativa no botão e painel clicado
            if (tipo === 'mesa') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.getElementById('form-mesa').classList.add('active');
            } else {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                document.getElementById('form-funcionario').classList.add('active');
            }
        }

        // 2. Ação ao enviar o formulário da MESA
        function ativarMesa(event) {
            event.preventDefault(); // Impede a página de recarregar
            
            // Captura os dados digitados nos inputs
            const mesa = document.getElementById('numero-mesa').value;
            const senha = document.getElementById('senha-gerente').value;

            console.log("Tentando ativar dispositivo...");
            console.log("Mesa digitada:", mesa);
            console.log("Senha digitada:", senha);

            // [Próximo Passo DevOps]: Aqui o JS vai validar a senha no banco de dados.
            // Se der certo, guardamos a mesa na memória:
            localStorage.setItem('id_mesa_configurada', mesa);
            
            alert(`Sucesso! Este tablet agora está travado como MESA ${mesa}`);
        }

        // 3. Ação ao enviar o formulário do FUNCIONÁRIO
        function loginFuncionario(event) {
            event.preventDefault();
            
            const usuario = document.getElementById('login-user').value;
            const senha = document.getElementById('senha-user').value;

            console.log("Tentando logar funcionário...");
            console.log("Usuário:", usuario);
            console.log("Senha:", senha);

            // [Próximo Passo DevOps]: Aqui o JS enviará os dados para a API do backend
            alert(`Verificando credenciais do usuário: ${usuario}`);
        }
    </script>
</body>
</html>
