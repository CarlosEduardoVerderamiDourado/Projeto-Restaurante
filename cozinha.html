<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ratatue - Painel de Controle da Cozinha</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 20px; background-color: #f4f6f9; color: #333; }
        .topo-painel { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #ccc; padding-bottom: 10px; margin-bottom: 20px; }
        .btn-sair { padding: 8px 16px; background-color: #dc3545; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-sair:hover { background-color: #c82333; }
        #container-pedidos { display: flex; flex-wrap: wrap; gap: 15px; }
        .pedido-card { border: 2px solid #333; padding: 15px; border-radius: 8px; background: #fff; width: 280px; box-shadow: 2px 2px 10px rgba(0,0,0,0.1); cursor: pointer; transition: transform 0.2s; }
        .pedido-card:hover { transform: translateY(-3px); }
    </style>
</head>
<body>

    <!-- 🚨 CORTINA DE CONFIRMAÇÃO VISUAL (Para o Logout Seguro da Cozinha) -->
    <div id="tela-confirmacao-cozinha" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); color: white; z-index: 9999; text-align: center; padding-top: 15%;">
        <div style="background: #222; display: inline-block; padding: 30px; border-radius: 10px; border: 2px solid #ffc107; max-width: 400px; text-align: center;">
            <h2 style="color: #ffc107; font-size: 24px; margin: 0;">🚪 Sair da Cozinha</h2>
            <p style="font-size: 18px; margin: 20px 0;">Deseja realmente encerrar a sua sessão de trabalho na produção?</p>
            <div style="display: flex; gap: 15px; justify-content: center;">
                <button id="btn-cozinha-sim" style="padding: 10px 20px; background: #28a745; color: white; border: none; font-weight: bold; border-radius: 4px; cursor: pointer;">Sim</button>
                <button id="btn-cozinha-nao" style="padding: 10px 20px; background: #dc3545; color: white; border: none; font-weight: bold; border-radius: 4px; cursor: pointer;">Não</button>
            </div>
        </div>
    </div>

    <!-- CABEÇALHO DO PAINEL OPERACIONAL -->
    <div class="topo-painel">
        <h1 style="margin: 0; font-size: 28px;">🍳 KDS Ratatue - Controle de Preparo</h1>
        <button class="btn-sair" onclick="fazerLogoutCozinha()">🚪 Sair / Deslogar</button>
    </div>

    <p style="margin-bottom: 25px; color: #555;">Clique em cima de um pedido para avançar o estado dele. (Os atrasados ficam vermelhos automaticamente!)</p>

    <!-- 🎯 CONTEINER PRINCIPAL: Onde o JavaScript injeta as comandas de comida -->
    <div id="container-pedidos">
        <p style="color: #888;">Carregando esteira de preparos da cozinha...</p>
    </div>

    <!-- 🧠 LÓGICA E EXTENSÕES JAVASCRIPT -->
    <script>
        // 🔄 Polling Automático da Cozinha: Puxa os dados de 5 em 5 segundos do Node
        window.onload = function() {
            carregarPedidosCozinha();
            setInterval(carregarPedidosCozinha, 5000);
        }

        // 📥 BUSCA ASYNC: Consome a rota limpa do backend para puxar a fila da chapa
        function carregarPedidosCozinha() {
            fetch("http://localhost:3000/api/pedidos/pendentes")
            .then(res => res.json())
            .then(pedidos => {
                console.log("🟢 KDS: Dados de preparo recebidos do MariaDB:", pedidos);
                renderizarCardsKDS(pedidos);
            })
            .catch(erro => console.error("❌ Erro de comunicação com o servidor KDS:", erro));
        }

        // 🎨 DESENHISTA DE INTERFACE MESTRE: Controla cores por status, tempo de atraso e exibe observações
        function renderizarCardsKDS(listaDePedidos) {
            const container = document.getElementById('container-pedidos');
            if (!container) return;
            container.innerHTML = "";

            if (!listaDePedidos || listaDePedidos.length === 0) {
                container.innerHTML = "<p style='color: #666; padding: 20px; font-weight: bold;'>🎉 Cozinha limpa! Nenhum pedido pendente na esteira.</p>";
                return;
            }

            listaDePedidos.forEach(p => {
                const idPedidoReal = p.id_pedido || p.ID_PEDIDO;
                const idComandaReal = p.id_comanda || p.ID_COMANDA;
                const nomeItemReal = p.nome_item || p.NOME_ITEM;
                const quantidadeReal = p.quantidade || p.QUANTIDADE;
                
                let statusPreparoBruto = p.status_preparo || "Pendente";
                let statusMacro = "Pendente";
                let observacaoTexto = "";

                // Separa o status macro da observação entre parênteses
                if (statusPreparoBruto.includes('(')) {
                    observacaoTexto = statusPreparoBruto.substring(statusPreparoBruto.indexOf('('));
                    statusMacro = statusPreparoBruto.substring(0, statusPreparoBruto.indexOf('(')).trim();
                } else {
                    statusMacro = statusPreparoBruto.trim();
                }

                // ⏱️ CÁLCULO DE ATRASO RELATIVO: Compara o horário do pedido com o relógio atual
                const horarioPedido = new Date(p.horario_pedido);
                const agora = new Date();
                const minutosPassados = Math.floor((agora - horarioPedido) / 60000) || 0;

                // 🎨 REGRAS DE CORES ENGENHARIA CRUCIAL:
                let corBordaCard = "#ffc107"; // Padrão: Amarelo (Em Espera)
                let textoStatusVisual = "Em Espera";

                if (statusMacro === "Em Preparo") {
                    corBordaCard = "#007bff"; // Azul (Em Preparo)
                    textoStatusVisual = "Em Preparo";
                }

                // Se o pedido passar de 10 minutos na esteira, vira Alerta Vermelho de Atraso automaticamente!
                if (minutosPassados >= 10) {
                    corBordaCard = "#dc3545"; // Vermelho (Atrasado)
                    textoStatusVisual += " [ATRASADO]";
                }

                const cardHTML = `
                    <div class="pedido-card" onclick="avancarStatusPedido(${idPedidoReal}, '${statusPreparoBruto}')" 
                         style="border: 3px solid ${corBordaCard}; padding: 15px; border-radius: 8px; background: #fff; width: 280px; box-shadow: 2px 2px 10px rgba(0,0,0,0.1); cursor: pointer; display: inline-block; margin: 10px; vertical-align: top; color: #000; text-align: left;">
                        <h3 style="text-align: center; margin-top: 0; color: #000;">Pedido #${idPedidoReal}</h3>
                        <p style="margin: 5px 0;">Comanda: <strong>${idComandaReal}</strong></p>
                        <p style="margin: 5px 0;">Tempo: <strong>${minutosPassados} min atrás</strong></p>
                        <p style="margin: 5px 0;">Status: <strong style="color: ${corBordaCard};">${textoStatusVisual}</strong></p>
                        <hr style="border: 0; border-top: 1px solid #ccc; margin: 10px 0;">
                        
                        <ul style="padding-left: 20px; margin: 0; color: #000;">
                            <li>
                                <strong>${quantidadeReal}x ${nomeItemReal}</strong>
                                <!-- 🟢 CORREÇÃO CRUCIAL: Removida a barra invertida antes do cifrão para a variável imprimir o texto real! -->
                                ${observacaoTexto ? `<br><span style="color: #dc3545; font-weight: bold; font-size: 13px; background: #f8d7da; padding: 4px 8px; border-radius: 4px; display: inline-block; margin-top: 6px; width: 90%;">⚠️ OBS: \${observacaoTexto}</span>` : ''}
                            </li>
                        </ul>
                    </div>
                `;

                container.innerHTML += cardHTML;
            });
        }


        // 🔄 MUDANÇA DE ESTADO CORRIGIDA: Avança o fluxo tratando strings com parênteses e despacha pro garçom!
        function avancarStatusPedido(id_pedido, statusAtual) {
            let proximoStatus = "Em Preparo";
            
            // 🟢 CORREÇÃO MESTRE: Usa .includes() para capturar mesmo se tiver observação grudada (Ex: "Em Preparo (Sem picles)")
            if (statusAtual && statusAtual.includes("Em Preparo")) {
                proximoStatus = "Pronto";
                if (!confirm(`Deseja despachar o pedido #${id_pedido} como CONCLUÍDO para a esteira do Garçom?`)) return;
            }

            console.log(`🔀 KDS: Solicitando mudança do pedido #${id_pedido} para: ${proximoStatus}...`);

            fetch("http://localhost:3000/api/pedidos/atualizar-status", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ id_pedido, novo_status: proximoStatus })
            })
            .then(res => res.json())
            .then(dados => {
                console.log("Resposta do servidor:", dados.mensagem);
                carregarPedidosCozinha(); // Força a atualização da tela na hora!
            })
            .catch(erro => console.error("Erro assíncrono ao transicionar pedido:", erro));
        }


        // 🚪 AÇÃO COZINHA: Cortina de Logout Supremo com limpeza de chaves locais
        function fazerLogoutCozinha() {
            document.getElementById('tela-confirmacao-cozinha').style.display = 'block';

            document.getElementById('btn-cozinha-sim').onclick = function() {
                localStorage.removeItem('id_funcionario_logado');
                localStorage.removeItem('cargo');
                console.log("Sessão da Cozinha encerrada. Retornando ao QG...");
                window.location.href = "index.html";
            };

            document.getElementById('btn-cozinha-nao').onclick = function() {
                document.getElementById('tela-confirmacao-cozinha').style.display = 'none';
            };
        }
    </script>
</body>
</html>
